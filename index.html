<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>당신의 계절 · 약관과 개인정보</title>
<style>
:root{--paper:#faf6eb;--ink:#2e3a32;--ink-body:#3c463a;--ink-muted:#3f4735;
--green:#617848;--line:rgba(46,58,50,.12)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink-body);
font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
font-size:17px;line-height:1.85;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:720px;margin:0 auto;padding:40px 22px 80px}
.brand{font-size:14px;letter-spacing:.14em;color:var(--green);margin:0 0 6px}
h1{font-size:30px;line-height:1.4;color:var(--ink);margin:0 0 8px}
h2{font-size:21px;line-height:1.5;color:var(--ink);margin:44px 0 12px;
padding-top:22px;border-top:1px solid var(--line)}
h2:first-of-type{border-top:0;padding-top:0}
h3{font-size:18px;color:var(--ink);margin:28px 0 10px}
p{margin:0 0 14px}
ol,ul{margin:0 0 16px;padding-left:22px}
li{margin-bottom:8px}
li>ul{margin:8px 0 0}
strong{color:var(--ink)}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
.table-wrap{overflow-x:auto;margin:0 0 20px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
th{background:rgba(97,120,72,.08);color:var(--ink);white-space:nowrap}
.nav{margin:0 0 28px;font-size:16px}
.nav a{color:var(--green);margin-right:16px}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
font-size:15px;color:var(--ink-muted)}
@media (max-width:480px){body{font-size:16px}h1{font-size:25px}.wrap{padding:28px 18px 60px}}
</style>
</head>
<body>
<div class="wrap">
<p class="brand">당신의 계절</p>
<h1>약관과 개인정보</h1>

</html>
